// ═══════════════════════════════════════════════════════════
// $1 UNISTROKE RECOGNIZER
// ═══════════════════════════════════════════════════════════
const N_RESAMPLE = 64, SQ_SIZE = 250;
const PHI = 0.5 * (-1 + Math.sqrt(5));
const ANGLE_RANGE = 45 * (Math.PI / 180);
const ANGLE_PRECISION = 2 * (Math.PI / 180);
const HALF_DIAGONAL = 0.5 * Math.sqrt(SQ_SIZE * SQ_SIZE * 2);
function pathLen(p) { let d = 0; for (let i = 1; i < p.length; i++) d += Math.hypot(p[i].x - p[i-1].x, p[i].y - p[i-1].y); return d; }
function pathDist(a, b) { let d = 0; for (let i = 0; i < a.length; i++) d += Math.hypot(a[i].x - b[i].x, a[i].y - b[i].y); return d / a.length; }
function centroid(p) { let x = 0, y = 0; for (const q of p) { x += q.x; y += q.y; } return { x: x / p.length, y: y / p.length }; }
function resample(pts, n) {
  if (pts.length < 2) return pts.slice();
  pts = pts.slice(); const I = pathLen(pts) / (n - 1); let D = 0; const out = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    const d = Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
    if (D + d >= I && d > 0) {
      const t = (I - D) / d, q = { x: pts[i-1].x + t * (pts[i].x - pts[i-1].x), y: pts[i-1].y + t * (pts[i].y - pts[i-1].y) };
      out.push(q); pts.splice(i, 0, q); D = 0;
    } else D += d;
  }
  while (out.length < n) out.push(pts[pts.length - 1]); return out;
}
function rotateBy(p, t) { const c = centroid(p), cs = Math.cos(t), sn = Math.sin(t); return p.map(q => ({ x: (q.x - c.x) * cs - (q.y - c.y) * sn + c.x, y: (q.x - c.x) * sn + (q.y - c.y) * cs + c.y })); }
function indicativeAngle(p) { const c = centroid(p); return Math.atan2(c.y - p[0].y, c.x - p[0].x); }
function scaleTo(p, s) { let mnx = Infinity, mxx = -Infinity, mny = Infinity, mxy = -Infinity; for (const q of p) { if (q.x < mnx) mnx = q.x; if (q.x > mxx) mxx = q.x; if (q.y < mny) mny = q.y; if (q.y > mxy) mxy = q.y; } const w = mxx - mnx || 1, h = mxy - mny || 1; return p.map(q => ({ x: q.x * s / w, y: q.y * s / h })); }
function translateTo(p, t) { const c = centroid(p); return p.map(q => ({ x: q.x + t.x - c.x, y: q.y + t.y - c.y })); }
function distAtAngle(p, T, t) { return pathDist(rotateBy(p, t), T); }
function distAtBest(p, T, a, b, th) {
  let x1 = PHI * a + (1 - PHI) * b, f1 = distAtAngle(p, T, x1);
  let x2 = (1 - PHI) * a + PHI * b, f2 = distAtAngle(p, T, x2);
  while (Math.abs(b - a) > th) {
    if (f1 < f2) { b = x2; x2 = x1; f2 = f1; x1 = PHI * a + (1 - PHI) * b; f1 = distAtAngle(p, T, x1); }
    else { a = x1; x1 = x2; f1 = f2; x2 = (1 - PHI) * a + PHI * b; f2 = distAtAngle(p, T, x2); }
  }
  return Math.min(f1, f2);
}
function preprocess(raw) { let p = resample(raw, N_RESAMPLE); p = rotateBy(p, -indicativeAngle(p)); p = scaleTo(p, SQ_SIZE); p = translateTo(p, { x: 0, y: 0 }); return p; }
const TEMPLATES_ALL = [];      // every glyph template (30)
let TEMPLATES_ACTIVE = [];     // currently-equipped subset (deck of 8)
function reg(name, raw) { TEMPLATES_ALL.push({ name, points: preprocess(raw) }); }
function setActiveTemplates(deckIds) { TEMPLATES_ACTIVE = TEMPLATES_ALL.filter(t => deckIds.includes(t.name)); }
function recognize(raw) {
  if (raw.length < 5 || TEMPLATES_ACTIVE.length === 0) return { name: null, score: 0 };
  const c = preprocess(raw); let best = Infinity, n = null;
  for (const t of TEMPLATES_ACTIVE) { const d = distAtBest(c, t.points, -ANGLE_RANGE, ANGLE_RANGE, ANGLE_PRECISION); if (d < best) { best = d; n = t.name; } }
  return { name: n, score: Math.max(0, 1 - best / HALF_DIAGONAL) };
}
function circ(cx, cy, r, n, dir) { const out = []; for (let i = 0; i <= n; i++) { const a = (i / n) * Math.PI * 2 * (dir || 1) - Math.PI / 2; out.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r }); } return out; }

// ═══════════════════════════════════════════════════════════
// LOCAL STORAGE
// ═══════════════════════════════════════════════════════════
const SAVE_KEY = 'glyphduel:save:v1';
const DEFAULT_DECK = ['bolt', 'fireball', 'icicle', 'barrier', 'heal', 'parry', 'manadrain', 'lightnet'];
const DEFAULT_SAVE = {
  deck: DEFAULT_DECK.slice(),
  difficulty: 'normal',
  lifetime: { wins: 0, losses: 0, draws: 0, matches: 0, totalDmg: 0, totalCasts: 0, bestScore: 0 },
};
let save = (() => {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_SAVE));
    const s = JSON.parse(raw);
    // Migrate / sanitize
    s.deck = Array.isArray(s.deck) && s.deck.length === 8 && s.deck.every(id => G[id]) ? s.deck : DEFAULT_DECK.slice();
    s.difficulty = ['easy', 'normal', 'hard'].includes(s.difficulty) ? s.difficulty : 'normal';
    s.lifetime = Object.assign({ wins: 0, losses: 0, draws: 0, matches: 0, totalDmg: 0, totalCasts: 0, bestScore: 0 }, s.lifetime || {});
    return s;
  } catch (e) { return JSON.parse(JSON.stringify(DEFAULT_SAVE)); }
})();
function persistSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
setActiveTemplates(save.deck);

// ═══════════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════════
const AC = window.AudioContext || window.webkitAudioContext;
const ac = AC ? new AC() : null;
let drawTone = null;
function ensureAudio() { if (ac && ac.state === 'suspended') ac.resume(); }
function startDrawTone() {
  if (!ac || drawTone) return;
  ensureAudio();
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sawtooth'; o.frequency.value = 220;
  g.gain.value = 0; g.gain.linearRampToValueAtTime(0.04, ac.currentTime + 0.05);
  o.connect(g); g.connect(ac.destination); o.start();
  drawTone = { o, g };
}
function stopDrawTone() {
  if (!drawTone || !ac) return;
  const { o, g } = drawTone; g.gain.cancelScheduledValues(ac.currentTime);
  g.gain.linearRampToValueAtTime(0, ac.currentTime + 0.05);
  setTimeout(() => { try { o.stop(); } catch (e) {} }, 80);
  drawTone = null;
}
function beep(f, d, t, v) {
  if (!ac) return; ensureAudio();
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = t || 'sine'; o.frequency.value = f;
  const vol = v == null ? 0.12 : v;
  g.gain.setValueAtTime(0, ac.currentTime); g.gain.linearRampToValueAtTime(vol, ac.currentTime + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
}
const FREQ = { attack: 880, defense: 440, movement: 660, trap: 330, counter: 1200 };
function fireSE(glyphId, tier) {
  const def = G[glyphId]; if (!def) return;
  const f = FREQ[def.cat] || 500;
  if (tier === 'critical') { beep(f * 2, 0.18, 'square', 0.18); beep(f, 0.30, 'sawtooth', 0.10); }
  else if (tier === 'normal') beep(f, 0.18, 'square', 0.12);
  else if (tier === 'weak') beep(f * 0.5, 0.10, 'triangle', 0.06);
}
function hitSE() { beep(80, 0.15, 'sawtooth', 0.18); beep(160, 0.06, 'square', 0.10); }
function unfireSE() { beep(120, 0.05, 'square', 0.04); }
function clickSE() { beep(660, 0.04, 'square', 0.06); }
function comboSE() { beep(880, 0.08, 'square', 0.14); beep(1320, 0.12, 'square', 0.10); }

// ═══════════════════════════════════════════════════════════
// SCORE TIERS
// ═══════════════════════════════════════════════════════════
function scoreToTier(s) { return s < 0.30 ? 'unfire' : s < 0.60 ? 'weak' : s < 0.85 ? 'normal' : 'critical'; }
function tierMult(t) { return t === 'weak' ? 0.5 : t === 'critical' ? 1.5 : 1.0; }
function tierColor(t) { return t === 'critical' ? '#ffdd44' : t === 'normal' ? '#7df9ff' : t === 'weak' ? '#888' : '#a44'; }

// ═══════════════════════════════════════════════════════════
// SYNERGY GATING (Sprint 1-A3)
// Required-combo glyphs check prep state. comboMet returns
// { ok, partial, hint } where partial means cast still fires but
// at reduced effect.
// ═══════════════════════════════════════════════════════════
function recentCast(c, ids, withinSec) {
  if (!c.recentCasts) return false;
  for (const r of c.recentCasts) {
    if (ids.includes(r.id) && (state.battleClock - r.t) <= withinSec) return true;
  }
  return false;
}
function checkComboGate(c, t, glyphId) {
  switch (glyphId) {
    case 'doubleburst':
      return recentCast(c, ['fireball', 'flame'], 3) ? { ok: true, hint: 'FIRE-PREPARED' } : { ok: false, partial: 0.5, hint: 'NEEDS FIRE PREP (×0.5)' };
    case 'immortal':
      return recentCast(c, ['barrier', 'reflect'], 4) ? { ok: true, hint: 'DEFENSE-PREPARED' } : { ok: false, partial: 0.5, hint: 'NEEDS DEF PREP (½ DUR)' };
    case 'reverse': {
      const enemyBuffed = (t.barrier > 0 || t.reflectNext > 0 || t.mirrorNext > 0 || t.doubleNext > 0 || t.halveNext > 0 || t.fastMana > 0 || t.invuln > 0);
      return enemyBuffed ? { ok: true, hint: 'BUFF DETECTED' } : { ok: false, partial: 0, hint: 'NEEDS ENEMY BUFF' };
    }
    case 'vengeance':
      return c.hp < c.hpMax / 2 ? { ok: true, hint: 'WOUNDED' } : { ok: false, partial: 0.5, hint: 'NEEDS HP<50% (½ COUNTER)' };
    case 'manazone':
    case 'resonance':
    case 'trapset':
      return { ok: true, hint: '' };
    case 'trigger':
      return c.traps > 0 ? { ok: true, hint: '' } : { ok: false, partial: 0, hint: 'NO TRAP' };
    default:
      return { ok: true, hint: '' };
  }
}

// ═══════════════════════════════════════════════════════════
function applyDamage(target, dmg, opts) {
  opts = opts || {};
  if (target.invuln > 0) { pushEffect({ type: 'invulnFlash', who: target, life: 18 }); return 0; }
  if (target.parry > 0) {
    target.parry = 0;
    pushEffect({ type: 'parryFlash', who: target, life: 24 });
    triggerVengeance(target, opts.attacker);
    return 0;
  }
  if (target.reflectNext > 0 && opts.attacker) {
    target.reflectNext = 0;
    pushEffect({ type: 'reflectFlash', who: target, life: 24 });
    return applyDamage(opts.attacker, dmg, { attacker: target });
  }
  if (target.barrier > 0) { pushEffect({ type: 'barrierHit', who: target, life: 18 }); return 0; }
  if (opts.attacker && opts.attacker.gravWeak > 0) { dmg *= 1.3; opts.attacker.gravWeak = 0; }
  target.hp = Math.max(0, target.hp - dmg);
  state.shakeFrames = 12; state.shakeAmp = 6;
  state.flashAlpha = Math.max(state.flashAlpha, 0.18);
  hitSE();
  pushEffect({ type: 'hit', x: target.x, y: target.y - 30, life: 24, color: '#ff4488' });
  // Stats
  if (target === state.ai) { state.matchStats.dmgDealt += dmg; state.matchStats.hits++; }
  else state.matchStats.dmgTaken += dmg;
  triggerVengeance(target, opts.attacker);
  if (target.hp <= 0 && !state.gameOver) endMatch(target === state.p1 ? 'ai' : 'p1');
  return dmg;
}
function triggerVengeance(target, attacker) {

  target.vengeance = 0;
  const dmg = 30 * counter;
  if (dmg <= 0) return;
  setTimeout(() => { if (!state.gameOver) { applyDamage(attacker, dmg, { attacker: target }); pushEffect({ type: 'vengeanceFlash', who: attacker, life: 24 }); beep(220, 0.15, 'sawtooth', 0.15); } }, 200);
}
function castGlyph(casterKey, glyphId, score, tier) {

  if (c.manaLock > 0) {
    state.scoreFeedback = { glyphId, score, tier, fired: false, reason: 'MANA LOCKED', caster: casterKey, life: 80 };
    unfireSE(); return;
  }
  let manaCost = def.mana;
  if (c.halveNext > 0) { manaCost = Math.ceil(manaCost / 2); c.halveNext = 0; }
  if (c.mana < manaCost) {
    state.scoreFeedback = { glyphId, score, tier, fired: false, reason: 'NO MANA', caster: casterKey, life: 80 };
    unfireSE(); return;
  }
  // Synergy gate
  const gate = checkComboGate(c, t, glyphId);
  if (!gate.ok && gate.partial === 0) {
    // Block: spend mana but no effect (e.g., trigger without trap, reverse without enemy buff)
    c.mana -= manaCost;
    state.scoreFeedback = { glyphId, score, tier, fired: false, reason: gate.hint, caster: casterKey, life: 80 };
    unfireSE();
    return;
  }
  c.mana -= manaCost;
  c.lastCast = glyphId;
  c.lastCastFlash = 60;
  c.recentCasts.push({ id: glyphId, t: state.battleClock });
  // keep last 8 casts
  if (c.recentCasts.length > 8) c.recentCasts.shift();

  let mult = tierMult(tier);
  if (def.cat === 'attack' && c.doubleNext > 0) { mult *= 2; c.doubleNext = 0; }
  // Required-combo partial penalty
  if (!gate.ok && gate.partial != null) mult *= gate.partial;
  if (gate.ok && gate.hint) {

    pushEffect({ type: 'comboFlash', who: c, life: 40, hint: gate.hint });
  }

    case 'icicle':
      state.projectiles.push({ x: c.x, y: c.y - 30, tx: t.x, ty: t.y - 30, t: 0, dur: 22, dmg: def.dmg * mult, color: def.color, target: ok, kind: 'icicle', attacker: c });

    case 'windblade':
      state.projectiles.push({ x: c.x, y: c.y - 40, tx: t.x, ty: t.y - 40, t: 0, dur: 18, dmg: def.dmg * mult, color: def.color, target: ok, kind: 'windblade', attacker: c });
      break;
    case 'beam':

      break;
    case 'gravorb':
      pushEffect({ type: 'boltBeam', from: c, to: t, life: 14, color: def.color, dmg: def.dmg * mult, applied: false, attacker: c });

    case 'lightnet':

    case 'barrier':       c.barrier = 3.0 * mult; pushEffect({ type: 'barrierStart', who: c, life: 30 }); break;
    case 'reflect':       c.reflectNext = 1; pushEffect({ type: 'reflectStart', who: c, life: 30 }); break;
    case 'heal':          c.hp = Math.min(c.hpMax, c.hp + 30 * mult); pushEffect({ type: 'healAura', who: c, life: 50 }); break;
    case 'cleanse':       c.burn = 0; c.burnDmg = 0; c.stun = 0; c.slowMana = 0; c.manaLock = 0; pushEffect({ type: 'cleanseAura', who: c, life: 30 }); break;
    case 'mirror':        c.mirrorNext = 1; pushEffect({ type: 'mirrorStart', who: c, life: 30 }); break;
    case 'immortal':      c.invuln = 3.0 * mult; pushEffect({ type: 'invulnStart', who: c, life: 36 }); break;
    case 'manadrain': {
      const drain = Math.min(t.mana, 20 * mult);

      c.mana = Math.min(c.manaMax, c.mana + drain * 0.5);

    case 'teleport':      c.parry = 0.5 * mult; pushEffect({ type: 'tpFlash', who: c, life: 18 }); break;
    case 'windrun':       c.fastMana = Math.max(c.fastMana, 3.0 * mult); pushEffect({ type: 'windAura', who: c, life: 40 }); break;
    case 'timeslow':      t.slowMana = Math.max(t.slowMana, 3.0 * mult); pushEffect({ type: 'slowAura', who: t, life: 40 }); break;
    case 'shadowwalk':    c.parry = 0.6 * mult; c.doubleNext = 1; pushEffect({ type: 'tpFlash', who: c, life: 18 }); break;
    case 'trapset':       c.traps = Math.min(2, c.traps + 1); pushEffect({ type: 'trapPlace', who: c, life: 40 }); break;
    case 'trigger': {
      const dmgEach = 25 * mult;
      for (let i = 0; i < c.traps; i++) applyDamage(t, dmgEach, { attacker: c });
      pushEffect({ type: 'trapBoom', x: t.x, y: t.y - 30, life: 30, color: def.color });

    case 'manazone':      c.fastMana = Math.max(c.fastMana, 5.0 * mult); pushEffect({ type: 'sigilAura', who: c, life: 60 }); break;
    case 'resonance':     c.halveNext = 1; pushEffect({ type: 'resAura', who: c, life: 30 }); break;

// AI TIERS (Sprint 1-A5)
// ═══════════════════════════════════════════════════════════
const AI_POOL_EASY = ['bolt', 'fireball', 'barrier', 'heal', 'parry'];
const AI_POOL_NORMAL = ['bolt', 'fireball', 'icicle', 'windblade', 'gravorb', 'lightnet', 'flame', 'shadowstrike', 'barrier', 'heal', 'cleanse', 'manadrain', 'selfbuff', 'parry', 'windrun', 'timeslow', 'counterspell', 'reflect'];
const AI_POOL_HARD = G_ORDER.slice();
function aiPickHard() {
  const ai = state.ai, p1 = state.p1, mana = ai.mana;
  // 1) traps + trigger combo
  if (ai.traps > 0 && p1.parry === 0 && p1.barrier === 0 && mana >= 10 && Math.random() < 0.6) return 'trigger';
  if (ai.traps < 2 && p1.hp > 50 && mana >= 30 && Math.random() < 0.18) return 'trapset';
  // 2) Heal at low HP
  if (ai.hp < 35 && mana >= 40 && Math.random() < 0.7) return 'heal';
  // 3) Vengeance setup if wounded
  if (ai.hp < 50 && ai.vengeance === 0 && mana >= 70 && Math.random() < 0.25) return 'vengeance';
  // 4) Buff prep then doubleburst
  const recentlyFire = recentCast(ai, ['fireball', 'flame'], 3);
  if (recentlyFire && mana >= 80 && Math.random() < 0.55) return 'doubleburst';
  if (!recentlyFire && mana >= 35 && Math.random() < 0.18) return 'fireball';
  // 5) Defense prep then immortal
  const recentlyDef = recentCast(ai, ['barrier', 'reflect'], 4);
  if (ai.hp < 60 && recentlyDef && mana >= 70 && Math.random() < 0.4) return 'immortal';
  // 6) Drain when player has high mana
  if (p1.mana > 60 && mana >= 35 && Math.random() < 0.3) return 'manadrain';
  // 7) Reverse when player buffed
  const p1Buffed = (p1.barrier > 0 || p1.doubleNext > 0 || p1.mirrorNext > 0 || p1.fastMana > 0 || p1.reflectNext > 0);
  if (p1Buffed && mana >= 60 && Math.random() < 0.4) return 'reverse';
  // 8) Counter when player drawing
  if (drawing && mana >= 40 && Math.random() < 0.18) return 'counterspell';
  // 9) Self empower → big attack
  if (ai.doubleNext > 0 && mana >= 50) return 'beam';
  if (ai.doubleNext === 0 && mana >= 45 && Math.random() < 0.18) return 'selfbuff';
  // 10) Apply pressure
  if (p1.hp < 25 && mana >= 25) {
    const burst = ['bolt', 'fireball', 'beam', 'doubleburst'].filter(id => mana >= G[id].mana);

  }

  return null;
}
function pickAI(diff) {
  const pool = diff === 'easy' ? AI_POOL_EASY : diff === 'hard' ? AI_POOL_HARD : AI_POOL_NORMAL;
  const ai = state.ai;
  if (diff === 'hard') {
    const strategic = aiPickHard();
    if (strategic && ai.mana >= G[strategic].mana) return strategic;
  }
  // Heuristic baseline
  if (ai.hp < 35 && ai.mana >= 40 && Math.random() < (diff === 'easy' ? 0.55 : 0.7)) return 'heal';
  if (state.p1.hp < 25 && ai.mana >= 25) return ['bolt', 'fireball'].find(id => ai.mana >= G[id].mana) || pool[0];
  const candidates = pool.filter(id => G[id] && ai.mana >= G[id].mana);
  if (candidates.length === 0) return null;
  return candidates[Math.floor(Math.random() * candidates.length)];
}
function aiScoreFor(diff) {
  if (diff === 'easy') return 0.55 + Math.random() * 0.20;   // 0.55–0.75
  if (diff === 'hard') return 0.80 + Math.random() * 0.18;   // 0.80–0.98
  return 0.62 + Math.random() * 0.30;                          // 0.62–0.92
}
function aiCooldownFor(diff) {
  if (diff === 'easy') return 4.0 + Math.random() * 2.0;
  if (diff === 'hard') return 1.8 + Math.random() * 1.2;

}
function updateAI(dt) {
  if (state.gameOver) return;
  if (state.ai.stun > 0 || state.ai.manaLock > 0) { aiCooldown = Math.max(aiCooldown, 0.5); return; }
  aiCooldown -= dt;
  if (aiCooldown > 0) return;
  const pick = pickAI(save.difficulty);
  if (!pick) { aiCooldown = 1.0; return; }
  const score = aiScoreFor(save.difficulty);
  castGlyph('ai', pick, score, scoreToTier(score));

let drawing = false, stroke = [];

  const p = canvasCoords(e); pointerX = p.x; pointerY = p.y;

    const last = stroke[stroke.length - 1];

      stroke.push(p);
      if (drawTone) drawTone.o.frequency.value = 200 + Math.min(800, Math.hypot(p.x - last.x, p.y - last.y) * 40);
    }

  }

  if (scene === 'deck') { handleDeckClick(p); return; }

  if (scene === 'result') { handleResultClick(p); return; }
  if (scene === 'battle' && !state.gameOver) {

  }

  const tier = scoreToTier(res.score);
  if (tier === 'unfire') { state.scoreFeedback = { glyphId: res.name, score: res.score, tier, fired: false, reason: 'UNFIRED', caster: 'p1', life: 80 }; unfireSE(); }
  else { castGlyph('p1', res.name, res.score, tier); }

}

    if (scene === 'deck') { goMenu(); e.preventDefault(); return; }
    if (scene === 'difficulty') { goMenu(); e.preventDefault(); return; }
    if (scene === 'result') { goMenu(); e.preventDefault(); return; }
  }

function handleMenuClick(p) {

  // Deck
  if (inRect(p, 280, 440, 180, 50)) { clickSE(); goDeck(); return; }

function handleDeckClick(p) {

    return;
  }

  // Grid (6 cols × 5 rows)
  const cols = 6, cellW = 145, cellH = 92, startX = (960 - cols * cellW) / 2, startY = 70;
  for (let i = 0; i < G_ORDER.length; i++) {
    const cx = startX + (i % cols) * cellW, cy = startY + Math.floor(i / cols) * cellH;
    if (inRect(p, cx + 2, cy + 2, cellW - 4, cellH - 4)) {
      const id = G_ORDER[i];

}

function update(dt) {
  state.bgPulse += dt;
  if (scene !== 'battle') return;
  if (state.gameOver) {
    state.flashAlpha *= 0.92;
    if (state.shakeFrames > 0) state.shakeFrames--;
    postGameClock += dt;
    if (postGameClock > 2.2) gotoResult();
    return;
  }
  postGameClock = 0;
  state.battleClock += dt;
  // Time / sudden death
  if (!state.suddenDeath) {
    state.matchTime -= dt;
    if (state.matchTime <= 0) {
      state.matchTime = 0;
      if (state.p1.hp === state.ai.hp) {
        state.suddenDeath = true;
      } else {
        endMatch(state.p1.hp > state.ai.hp ? 'p1' : 'ai');
        return;
      }
    }
  } else {
    state.suddenDeathTime -= dt;
    if (state.suddenDeathTime <= 0) {
      endMatch(state.p1.hp >= state.ai.hp ? (state.p1.hp === state.ai.hp ? 'draw' : 'p1') : 'ai');
      return;
    }
  }
  // Mana regen (halved during sudden death)
  for (const k of ['p1', 'ai']) {
    const p = state[k];
    let regen = state.suddenDeath ? 0 : 5;
    if (p.fastMana > 0) regen += 5;
    if (p.slowMana > 0) regen *= 0.5;
    p.mana = Math.min(p.manaMax, p.mana + regen * dt);
    p.barrier = Math.max(0, p.barrier - dt);
    p.parry = Math.max(0, p.parry - dt);
    p.invuln = Math.max(0, p.invuln - dt);
    p.fastMana = Math.max(0, p.fastMana - dt);
    p.slowMana = Math.max(0, p.slowMana - dt);
    p.stun = Math.max(0, p.stun - dt);
    p.manaLock = Math.max(0, p.manaLock - dt);
    if (p.burn > 0) {
      burnTickAcc[k] += dt;
      while (burnTickAcc[k] >= 0.5 && p.burn > 0) {
        burnTickAcc[k] -= 0.5;
        p.hp = Math.max(0, p.hp - p.burnDmg);
        if (k === 'p1') state.matchStats.dmgTaken += p.burnDmg;
        else state.matchStats.dmgDealt += p.burnDmg;
        pushEffect({ type: 'burnTick', who: p, life: 14 });
      }
      p.burn = Math.max(0, p.burn - dt);
      if (p.burn === 0) { p.burnDmg = 0; burnTickAcc[k] = 0; }
      if (p.hp <= 0 && !state.gameOver) endMatch(k === 'p1' ? 'ai' : 'p1');
    }
    if (p.lastCastFlash > 0) p.lastCastFlash--;
  }
  updateAI(dt);
  for (const pr of state.projectiles) {
    pr.t++;
    if (pr.t >= pr.dur) {
      const tgt = state[pr.target];
      applyDamage(tgt, pr.dmg, { attacker: pr.attacker });
      pushEffect({ type: 'explosion', x: tgt.x, y: tgt.y - 30, life: 22, color: pr.color, size: pr.kind === 'fireball' ? 60 : 30 });
    }
  }
  state.projectiles = state.projectiles.filter(pr => pr.t < pr.dur);
  for (const ef of state.effects) {
    if (!ef.applied && ef.dmg && ['boltBeam','beamHoming','flameBurst','megaBoom','netHit'].includes(ef.type)) {
      const target = ef.to || ef.target || ef.who;
      if (target) applyDamage(target, ef.dmg, { attacker: ef.attacker });
      ef.applied = true;
    }
    ef.life--;
  }
  state.effects = state.effects.filter(ef => ef.life > 0);
  if (state.scoreFeedback) { state.scoreFeedback.life--; if (state.scoreFeedback.life <= 0) state.scoreFeedback = null; }
  if (state.shakeFrames > 0) state.shakeFrames--;
  state.flashAlpha *= 0.88;
}

// ═══════════════════════════════════════════════════════════
// RENDER — SCENE DISPATCH
// ═══════════════════════════════════════════════════════════
function render() {
  drawBackground();
  if (scene === 'menu') drawMenu();
  else if (scene === 'deck') drawDeckBuilder();
  else if (scene === 'difficulty') drawDifficulty();
  else if (scene === 'battle') drawBattleScene();
  else if (scene === 'result') drawResult();
}

// Background — used by all scenes
function drawBackground() {
  const bg = ctx.createLinearGradient(0, 0, 0, 640);
  bg.addColorStop(0, '#04060f'); bg.addColorStop(0.5, '#08081a'); bg.addColorStop(1, '#0a0420');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, 960, 640);
  ctx.strokeStyle = 'rgba(0,255,255,0.06)'; ctx.lineWidth = 1;
  for (let x = 0; x < 960; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 640); ctx.stroke(); }
  for (let y = 0; y < 640; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(960, y); ctx.stroke(); }
  if (scene === 'battle' || scene === 'result') {
    const hg = ctx.createLinearGradient(0, 380, 0, 540);
    hg.addColorStop(0, 'rgba(255,30,180,0.0)'); hg.addColorStop(1, 'rgba(255,30,180,0.18)');
    ctx.fillStyle = hg; ctx.fillRect(0, 380, 960, 160);
    ctx.fillStyle = '#000';
    for (let i = 0; i < 30; i++) { const bw = 18 + (i % 7) * 6, bh = 30 + ((i * 53) % 90); ctx.fillRect(i * 33, 540 - bh, bw, bh); }
    ctx.fillStyle = 'rgba(0,255,255,0.5)';
    for (let i = 0; i < 30; i++) { const bx = i * 33 + 4; for (let j = 0; j < 6; j++) { if (((i * 7 + j * 3 + Math.floor(state.bgPulse * 4)) % 11) === 0) ctx.fillRect(bx + (j * 3), 530 - j * 8, 1.5, 1.5); } }
  }
}

function drawButton(x, y, w, h, label, hover, color) {
  ctx.save();
  ctx.fillStyle = hover ? 'rgba(20,30,50,0.9)' : 'rgba(10,15,25,0.7)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = color; ctx.lineWidth = hover ? 3 : 1.5;
  ctx.shadowColor = color; ctx.shadowBlur = hover ? 16 : 6;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  ctx.shadowBlur = 0;
  ctx.font = 'bold ' + Math.min(28, h - 22) + 'px monospace';
  ctx.fillStyle = hover ? '#fff' : color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w / 2, y + h / 2);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
}

// ─── DECK BUILDER ───
function drawDeckBuilder() {
  ctx.font = 'bold 22px monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = '#7df9ff'; ctx.shadowColor = '#7df9ff'; ctx.shadowBlur = 14;
  ctx.fillText('DECK · ' + deckEditing.length + ' / 8', 480, 32); ctx.shadowBlur = 0;
  ctx.font = '11px monospace'; ctx.fillStyle = '#666';
  ctx.fillText('CLICK GLYPHS TO TOGGLE · 8 EXACTLY TO SAVE', 480, 50);
  const cols = 6, cellW = 145, cellH = 92, startX = (960 - cols * cellW) / 2, startY = 70;
  for (let i = 0; i < G_ORDER.length; i++) {
    const id = G_ORDER[i], g = G[id];
    const cx = startX + (i % cols) * cellW, cy = startY + Math.floor(i / cols) * cellH;
    const selected = deckEditing.includes(id);
    const hover = inRect({ x: pointerX, y: pointerY }, cx + 2, cy + 2, cellW - 4, cellH - 4);
    ctx.fillStyle = selected ? 'rgba(40,60,80,0.9)' : 'rgba(20,20,30,0.8)';
    ctx.fillRect(cx + 2, cy + 2, cellW - 4, cellH - 4);
    ctx.strokeStyle = selected ? '#7df9ff' : (hover ? '#aaa' : g.color);
    ctx.lineWidth = selected ? 3 : (hover ? 2 : 1);
    ctx.shadowColor = selected ? '#7df9ff' : 'transparent';
    ctx.shadowBlur = selected ? 10 : 0;
    ctx.strokeRect(cx + 2.5, cy + 2.5, cellW - 5, cellH - 5);
    ctx.shadowBlur = 0;
    // Selected check
    if (selected) {
      const ord = deckEditing.indexOf(id) + 1;
      ctx.fillStyle = '#7df9ff'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'right';
      ctx.fillText('★' + ord, cx + cellW - 8, cy + 16);
    }
    // Mini icon
    ctx.save(); ctx.translate(cx + 22, cy + 26);
    ctx.strokeStyle = g.color; ctx.lineWidth = 1.6;
    ctx.shadowColor = g.color; ctx.shadowBlur = 5;
    drawGlyphIcon(g.shape, 14);
    ctx.restore();
    // Text
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px monospace';
    ctx.fillText(g.ja, cx + 44, cy + 22);
    ctx.fillStyle = CAT_COLOR[g.cat]; ctx.font = '8px monospace';
    ctx.fillText(CAT_LABEL_JA[g.cat] + ' · ' + g.syn.toUpperCase(), cx + 8, cy + 50);
    ctx.fillStyle = '#ccc'; ctx.font = '8px monospace';
    const desc = g.desc.length > 30 ? g.desc.slice(0, 30) + '…' : g.desc;
    ctx.fillText(desc, cx + 8, cy + 64);
    ctx.fillStyle = g.color; ctx.font = 'bold 9px monospace';
    ctx.fillText('M ' + g.mana + (g.dmg ? '  D ' + g.dmg : ''), cx + 8, cy + 80);
  }
  // Footer buttons
  drawButton(40, 580, 200, 40, 'BACK', inRect({ x: pointerX, y: pointerY }, 40, 580, 200, 40), '#888');
  drawButton(380, 580, 200, 40, 'DEFAULT DECK', inRect({ x: pointerX, y: pointerY }, 380, 580, 200, 40), '#ffdd44');
  const canSave = deckEditing.length === 8;
  drawButton(720, 580, 200, 40, canSave ? 'SAVE & BACK' : 'NEED ' + (8 - deckEditing.length), inRect({ x: pointerX, y: pointerY }, 720, 580, 200, 40), canSave ? '#88ff88' : '#666');
}

// ─── BATTLE ───
function drawBattleScene() {
  const sx = state.shakeFrames > 0 ? (Math.random() - 0.5) * state.shakeAmp : 0;
  const sy = state.shakeFrames > 0 ? (Math.random() - 0.5) * state.shakeAmp : 0;
  ctx.save(); ctx.translate(sx, sy);
  drawMage(state.p1, '#7df9ff', false);
  drawMage(state.ai, '#ff44dd', true);
  drawStatusAuras(state.p1);
  drawStatusAuras(state.ai);
  drawTraps(state.p1);
  drawTraps(state.ai);
  for (const pr of state.projectiles) drawProjectile(pr);
  for (const ef of state.effects) drawEffect(ef);
  if (state.drawTrail && state.drawTrail.length >= 2) drawTrail(state.drawTrail, '#7df9ff');
  drawBattleHUD();
  if (state.scoreFeedback) drawScoreFeedback(state.scoreFeedback);
  if (state.suddenDeath) drawSuddenDeathBanner();
  if (state.flashAlpha > 0.01) { ctx.fillStyle = `rgba(255,255,255,${state.flashAlpha})`; ctx.fillRect(0, 0, 960, 640); }
  ctx.restore();
}
function drawSuddenDeathBanner() {
  const a = 0.7 + Math.sin(state.bgPulse * 8) * 0.3;
  ctx.save();
  ctx.font = 'bold 22px monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = '#ff4488'; ctx.shadowColor = '#ff4488'; ctx.shadowBlur = 16; ctx.globalAlpha = a;
  ctx.fillText('SUDDEN DEATH · ' + Math.max(0, Math.ceil(state.suddenDeathTime)) + 's · NO MANA REGEN', 480, 96);
  ctx.restore();
}
function drawMage(p, color, mirror) {
  const t = state.bgPulse * 2 + (mirror ? 1 : 0);
  const bob = Math.sin(t) * 3;
  const x = p.x, y = p.y + bob;
  ctx.save(); ctx.translate(x, y);
  if (mirror) ctx.scale(-1, 1);
  if (p.lastCastFlash > 0) {
    const a = p.lastCastFlash / 60;
    ctx.fillStyle = color; ctx.globalAlpha = 0.15 * a;
    ctx.beginPath(); ctx.arc(0, -30, 60, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
  }
  ctx.fillStyle = '#0a0a18';
  ctx.beginPath();
  ctx.moveTo(-22, 0); ctx.lineTo(-26, -50); ctx.lineTo(-18, -78);
  ctx.lineTo(-8, -90); ctx.lineTo(8, -90); ctx.lineTo(18, -78);
  ctx.lineTo(26, -50); ctx.lineTo(22, 0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 1.5;
  ctx.shadowColor = color; ctx.shadowBlur = 8; ctx.stroke(); ctx.shadowBlur = 0;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(-3, -78, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(5, -78, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.shadowColor = color; ctx.shadowBlur = 12;
  ctx.fillStyle = color; ctx.globalAlpha = 0.4;
  ctx.beginPath(); ctx.arc(20, -30, 6 + Math.sin(t * 4) * 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  ctx.restore();
  drawStatusBadges(p);
}
function drawStatusBadges(p) {
  const items = [];
  if (p.barrier > 0) items.push({ l: 'BAR', c: '#88ff88' });
  if (p.parry > 0) items.push({ l: 'PRY', c: '#ffdd44' });
  if (p.invuln > 0) items.push({ l: 'INV', c: '#ffdd00' });
  if (p.reflectNext > 0) items.push({ l: 'RFL', c: '#aaffaa' });
  if (p.mirrorNext > 0) items.push({ l: 'MIR', c: '#dddddd' });
  if (p.doubleNext > 0) items.push({ l: 'PWR', c: '#ff8844' });
  if (p.halveNext > 0) items.push({ l: 'RES', c: '#ffeeaa' });
  if (p.burn > 0) items.push({ l: 'BRN', c: '#ff4422' });
  if (p.stun > 0) items.push({ l: 'STN', c: '#88ddff' });
  if (p.slowMana > 0) items.push({ l: 'SLW', c: '#88aaff' });
  if (p.fastMana > 0) items.push({ l: 'FST', c: '#88ffaa' });
  if (p.manaLock > 0) items.push({ l: 'LCK', c: '#ddff44' });
  if (p.vengeance > 0) items.push({ l: 'VEN', c: '#ff0044' });
  if (p.traps > 0) items.push({ l: 'TR' + p.traps, c: '#ffaa00' });
  let bx = p.x - (items.length * 26) / 2;
  for (const it of items) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(bx, p.y - 110, 24, 14);
    ctx.strokeStyle = it.c; ctx.lineWidth = 1; ctx.strokeRect(bx + 0.5, p.y - 109.5, 23, 13);
    ctx.fillStyle = it.c; ctx.font = 'bold 8px monospace'; ctx.textAlign = 'center';
    ctx.fillText(it.l, bx + 12, p.y - 100);
    ctx.restore();
    bx += 26;
  }
}
function drawStatusAuras(p) {
  if (p.barrier > 0) {
    ctx.strokeStyle = '#88ff88'; ctx.lineWidth = 2; ctx.shadowColor = '#88ff88'; ctx.shadowBlur = 14;
    ctx.globalAlpha = 0.3 + 0.2 * Math.sin(state.bgPulse * 8);
    ctx.beginPath(); ctx.arc(p.x, p.y - 40, 50, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }
  if (p.parry > 0) {
    ctx.strokeStyle = '#ffdd44'; ctx.lineWidth = 3; ctx.shadowColor = '#ffdd44'; ctx.shadowBlur = 20; ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.arc(p.x, p.y - 40, 38 + Math.sin(state.bgPulse * 12) * 3, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }
  if (p.invuln > 0) {
    ctx.strokeStyle = '#ffff00'; ctx.lineWidth = 4; ctx.shadowColor = '#ffff00'; ctx.shadowBlur = 30; ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.arc(p.x, p.y - 40, 60, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }
  if (p.reflectNext > 0) {
    ctx.strokeStyle = '#aaffaa'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
    ctx.shadowColor = '#aaffaa'; ctx.shadowBlur = 12; ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.arc(p.x, p.y - 40, 55, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }
  if (p.fastMana > 0) {
    ctx.fillStyle = '#88ffaa'; ctx.shadowColor = '#88ffaa'; ctx.shadowBlur = 10;
    for (let i = 0; i < 4; i++) {
      const a = (i / 4 + state.bgPulse * 0.5) * Math.PI * 2;
      ctx.globalAlpha = 0.5;
      ctx.beginPath(); ctx.arc(p.x + Math.cos(a) * 50, p.y - 30 + Math.sin(a) * 20, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }
  if (p.burn > 0) {
    ctx.fillStyle = '#ff4422'; ctx.shadowColor = '#ff4422'; ctx.shadowBlur = 12;
    for (let i = 0; i < 5; i++) {
      const o = i + state.bgPulse * 4;
      ctx.globalAlpha = 0.4;
      ctx.beginPath(); ctx.arc(p.x + Math.sin(o * 1.3) * 18, p.y - 20 - (o % 1) * 30, 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }
  if (p.stun > 0) {
    ctx.strokeStyle = '#88ddff'; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const a = state.bgPulse * 6 + (i / 3) * Math.PI * 2;
      ctx.beginPath(); ctx.arc(p.x + Math.cos(a) * 18, p.y - 95, 4, 0, Math.PI * 2); ctx.stroke();
    }
  }
}
function drawTraps(p) {
  if (p.traps <= 0) return;
  for (let i = 0; i < p.traps; i++) {
    const tx = p.x + (p.side === 'left' ? 60 + i * 30 : -60 - i * 30);
    const ty = 535;
    ctx.save();
    ctx.strokeStyle = '#ffaa00'; ctx.lineWidth = 2;
    ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 10;
    ctx.globalAlpha = 0.6 + Math.sin(state.bgPulse * 6 + i) * 0.3;
    ctx.beginPath();
    ctx.moveTo(tx - 10, ty - 10); ctx.lineTo(tx + 10, ty + 10);
    ctx.moveTo(tx + 10, ty - 10); ctx.lineTo(tx - 10, ty + 10);
    ctx.stroke();
    ctx.restore();
  }
}
function drawProjectile(pr) {
  const k = pr.t / pr.dur, x = pr.x + (pr.tx - pr.x) * k;
  let y = pr.y + (pr.ty - pr.y) * k;
  if (pr.kind === 'fireball') y -= Math.sin(k * Math.PI) * 60;
  ctx.save();
  ctx.shadowColor = pr.color; ctx.shadowBlur = 24;
  ctx.fillStyle = pr.color;
  const size = pr.kind === 'icicle' ? 6 : pr.kind === 'windblade' ? 14 : 12;
  ctx.beginPath(); ctx.arc(x, y, size + Math.sin(state.bgPulse * 30) * 2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.7;
  ctx.beginPath(); ctx.arc(x, y, size * 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawEffect(ef) {
  ctx.save();
  if (ef.type === 'boltBeam' || ef.type === 'beamHoming') {
    const a = ef.life / (ef.type === 'beamHoming' ? 24 : 16);
    const c = ef.from, d = ef.to;
    ctx.strokeStyle = ef.color; ctx.lineWidth = 4 + Math.random() * 6;
    ctx.shadowColor = ef.color; ctx.shadowBlur = 24; ctx.globalAlpha = a;
    ctx.beginPath(); ctx.moveTo(c.x, c.y - 40);
    const segs = 6;
    for (let i = 1; i <= segs; i++) {
      const t = i / segs;
      const x = c.x + (d.x - c.x) * t + (Math.random() - 0.5) * 24;
      const y = (c.y - 40) + ((d.y - 30) - (c.y - 40)) * t + (Math.random() - 0.5) * 24;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  } else if (ef.type === 'manaDrainBeam' || ef.type === 'lockBeam' || ef.type === 'stealBeam') {
    const a = ef.life / (ef.type === 'manaDrainBeam' ? 20 : ef.type === 'lockBeam' ? 22 : 24);
    const c = ef.from, d = ef.to;
    ctx.strokeStyle = ef.type === 'stealBeam' ? '#ff44aa' : (ef.type === 'lockBeam' ? '#ddff44' : '#aa88ff');
    ctx.lineWidth = 3; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 18; ctx.globalAlpha = a;
    ctx.setLineDash([8, 6]);
    ctx.beginPath(); ctx.moveTo(c.x, c.y - 40); ctx.lineTo(d.x, d.y - 40); ctx.stroke();
    ctx.setLineDash([]);
  } else if (ef.type === 'flameBurst') {
    const a = ef.life / 22;
    const c = ef.from, d = ef.to;
    ctx.strokeStyle = ef.color; ctx.lineWidth = 18 * a;
    ctx.shadowColor = ef.color; ctx.shadowBlur = 30; ctx.globalAlpha = a;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(c.x, c.y - 40);
    for (let i = 1; i <= 8; i++) {
      const t = i / 8, x = c.x + (d.x - c.x) * t + (Math.random() - 0.5) * 18, y = (c.y - 40) + ((d.y - 30) - (c.y - 40)) * t + (Math.random() - 0.5) * 18;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  } else if (ef.type === 'megaBoom') {
    const a = ef.life / 36, r = (1 - a) * 120;
    ctx.strokeStyle = ef.color; ctx.lineWidth = 4;
    ctx.shadowColor = ef.color; ctx.shadowBlur = 30; ctx.globalAlpha = a;
    ctx.beginPath(); ctx.arc(ef.x, ef.y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(ef.x, ef.y, r * 0.6, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = ef.color; ctx.globalAlpha = a * 0.4;
    ctx.beginPath(); ctx.arc(ef.x, ef.y, r * 0.5, 0, Math.PI * 2); ctx.fill();
  } else if (ef.type === 'netHit') {
    const a = ef.life / 30;
    ctx.strokeStyle = ef.color; ctx.lineWidth = 2;
    ctx.shadowColor = ef.color; ctx.shadowBlur = 14; ctx.globalAlpha = a;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.moveTo(ef.who.x - 60, ef.who.y - 30 + i * 15); ctx.lineTo(ef.who.x + 60, ef.who.y - 30 + i * 15); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ef.who.x + i * 15, ef.who.y - 90); ctx.lineTo(ef.who.x + i * 15, ef.who.y); ctx.stroke();
    }
  } else if (ef.type === 'explosion') {
    const a = ef.life / 22, r = ef.size * (1 - a);
    ctx.strokeStyle = ef.color; ctx.lineWidth = 3;
    ctx.shadowColor = ef.color; ctx.shadowBlur = 20; ctx.globalAlpha = a;
    ctx.beginPath(); ctx.arc(ef.x, ef.y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = ef.color; ctx.globalAlpha = a * 0.4;
    ctx.beginPath(); ctx.arc(ef.x, ef.y, r * 0.6, 0, Math.PI * 2); ctx.fill();
  } else if (ef.type === 'hit') {
    const a = ef.life / 24;
    ctx.fillStyle = ef.color; ctx.globalAlpha = a;
    ctx.shadowColor = ef.color; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(ef.x, ef.y, 25 * (1 - a), 0, Math.PI * 2); ctx.fill();
  } else if (ef.type === 'parryFlash' || ef.type === 'reflectFlash' || ef.type === 'invulnFlash' || ef.type === 'vengeanceFlash') {
    const a = ef.life / 24;
    const col = ef.type === 'parryFlash' ? '#ffdd44' : ef.type === 'reflectFlash' ? '#aaffaa' : ef.type === 'invulnFlash' ? '#ffff00' : '#ff0044';
    const lbl = ef.type === 'parryFlash' ? 'PARRY' : ef.type === 'reflectFlash' ? 'REFLECT' : ef.type === 'invulnFlash' ? 'INVULN' : 'VENGEANCE';
    ctx.strokeStyle = col; ctx.lineWidth = 4;
    ctx.shadowColor = col; ctx.shadowBlur = 30; ctx.globalAlpha = a;
    ctx.beginPath(); ctx.arc(ef.who.x, ef.who.y - 40, 60 * (1 - a) + 30, 0, Math.PI * 2); ctx.stroke();
    ctx.font = 'bold 18px monospace'; ctx.fillStyle = col; ctx.textAlign = 'center';
    ctx.fillText(lbl + '!', ef.who.x, ef.who.y - 100);
  } else if (ef.type === 'comboFlash') {
    const a = ef.life / 40;
    ctx.fillStyle = '#ffdd44'; ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center';
    ctx.shadowColor = '#ffdd44'; ctx.shadowBlur = 12; ctx.globalAlpha = a;
    ctx.fillText('COMBO · ' + (ef.hint || ''), ef.who.x, ef.who.y - 130);
  } else if (ef.type === 'barrierHit') {
    const a = ef.life / 18;
    ctx.strokeStyle = '#88ff88'; ctx.lineWidth = 3;
    ctx.shadowColor = '#88ff88'; ctx.shadowBlur = 25; ctx.globalAlpha = a;
    ctx.beginPath(); ctx.arc(ef.who.x, ef.who.y - 40, 50, 0, Math.PI * 2); ctx.stroke();
  } else if (['barrierStart', 'parryStart', 'reflectStart', 'invulnStart', 'mirrorStart', 'powerStart', 'resAura', 'sigilAura', 'cleanseAura', 'windAura', 'slowAura', 'vengeanceStart'].includes(ef.type)) {
    const a = ef.life / (ef.type === 'sigilAura' ? 60 : 30);
    const col = ef.type === 'barrierStart' ? '#88ff88' :
      ef.type === 'parryStart' ? '#ffdd44' :
      ef.type === 'reflectStart' ? '#aaffaa' :
      ef.type === 'invulnStart' ? '#ffff00' :
      ef.type === 'mirrorStart' ? '#dddddd' :
      ef.type === 'powerStart' ? '#ff8844' :
      ef.type === 'resAura' ? '#ffeeaa' :
      ef.type === 'sigilAura' ? '#ffaa44' :
      ef.type === 'cleanseAura' ? '#ddffdd' :
      ef.type === 'windAura' ? '#88ffaa' :
      ef.type === 'slowAura' ? '#88aaff' : '#ff0044';
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.shadowColor = col; ctx.shadowBlur = 18; ctx.globalAlpha = a;
    ctx.beginPath(); ctx.arc(ef.who.x, ef.who.y - 40, 50 + (1 - a) * 30, 0, Math.PI * 2); ctx.stroke();
  } else if (ef.type === 'tpFlash') {
    const a = ef.life / 18;
    ctx.fillStyle = '#cc88ff'; ctx.shadowColor = '#cc88ff'; ctx.shadowBlur = 20; ctx.globalAlpha = a;
    ctx.beginPath(); ctx.arc(ef.who.x, ef.who.y - 40, 30 * (1 - a) + 20, 0, Math.PI * 2); ctx.fill();
  } else if (ef.type === 'healAura') {
    const a = ef.life / 50;
    ctx.fillStyle = '#ff44dd'; ctx.shadowColor = '#ff44dd'; ctx.shadowBlur = 18;
    for (let i = 0; i < 6; i++) {
      const ang = (i / 6 + state.bgPulse * 0.3) * Math.PI * 2, rr = 30 + (1 - a) * 30;
      ctx.globalAlpha = a;
      ctx.beginPath(); ctx.arc(ef.who.x + Math.cos(ang) * rr, ef.who.y - 40 + Math.sin(ang) * rr * 0.6, 4, 0, Math.PI * 2); ctx.fill();
    }
  } else if (ef.type === 'trapPlace') {
    const a = ef.life / 40;
    ctx.strokeStyle = '#ffaa00'; ctx.lineWidth = 2;
    ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 14; ctx.globalAlpha = a;
    ctx.beginPath(); ctx.arc(ef.who.x, 535, 30 * (1 - a) + 8, 0, Math.PI * 2); ctx.stroke();
  } else if (ef.type === 'trapBoom') {
    const a = ef.life / 30, r = (1 - a) * 80;
    ctx.strokeStyle = ef.color; ctx.lineWidth = 4;
    ctx.shadowColor = ef.color; ctx.shadowBlur = 26; ctx.globalAlpha = a;
    ctx.beginPath(); ctx.arc(ef.x, ef.y, r, 0, Math.PI * 2); ctx.stroke();
  } else if (ef.type === 'burnTick') {
    const a = ef.life / 14;
    ctx.fillStyle = '#ff4422'; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
    ctx.globalAlpha = a; ctx.shadowColor = '#ff4422'; ctx.shadowBlur = 8;
    ctx.fillText('BURN', ef.who.x, ef.who.y - 110 - (1 - a) * 20);
  }
  ctx.restore();
}
function drawTrail(pts, color) {
  ctx.save();
  ctx.shadowColor = color; ctx.shadowBlur = 16;
  ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
  ctx.shadowBlur = 0; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
  ctx.restore();
}
function drawBattleHUD() {
  drawBar(20, 20, 360, 18, state.p1.hp / state.p1.hpMax, '#ff4488', '1P · HP', state.p1.hp);
  drawBar(20, 44, 360, 10, state.p1.mana / state.p1.manaMax, '#7df9ff', 'MANA', state.p1.mana);
  drawBar(580, 20, 360, 18, state.ai.hp / state.ai.hpMax, '#ff4488', save.difficulty.toUpperCase() + ' AI · HP', state.ai.hp, true);
  drawBar(580, 44, 360, 10, state.ai.mana / state.ai.manaMax, '#ff44dd', 'MANA', state.ai.mana, true);
  const sec = Math.max(0, Math.ceil(state.suddenDeath ? state.suddenDeathTime : state.matchTime));
  ctx.font = 'bold 36px monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = state.suddenDeath ? '#ff4488' : (sec <= 10 ? '#ff4488' : '#7df9ff');
  ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 14;
  ctx.fillText(String(sec).padStart(2, '0'), 480, 50);
  ctx.shadowBlur = 0;
  ctx.font = '10px monospace'; ctx.fillStyle = '#566';
  ctx.fillText(state.suddenDeath ? 'SUDDEN DEATH' : 'TIME', 480, 64);
  // Deck strip (bottom)
  drawDeckStrip();
}
function drawDeckStrip() {
  const ids = save.deck;
  const w = 90, gap = 8, total = ids.length * w + (ids.length - 1) * gap;
  let x = (960 - total) / 2;
  const y = 580;
  ctx.font = '9px monospace';
  for (const id of ids) {
    const g = G[id];
    if (!g) { x += w + gap; continue; }
    const have = state.p1.mana >= g.mana && state.p1.manaLock === 0;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(x, y, w, 50);
    ctx.strokeStyle = have ? g.color : '#333'; ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, 49);
    ctx.translate(x + 16, y + 24);
    ctx.strokeStyle = have ? g.color : '#444'; ctx.lineWidth = 1.5;
    ctx.shadowColor = have ? g.color : 'transparent'; ctx.shadowBlur = have ? 5 : 0;
    drawGlyphIcon(g.shape, 10);
    ctx.restore();
    ctx.fillStyle = have ? '#fff' : '#666'; ctx.font = 'bold 9px monospace'; ctx.textAlign = 'left';
    ctx.fillText(g.ja, x + 32, y + 16);
    ctx.fillStyle = have ? g.color : '#555';
    ctx.fillText('M' + g.mana + (g.dmg ? ' · D' + g.dmg : ''), x + 32, y + 30);
    if (g.syn === 'requiredCombo') { ctx.fillStyle = '#ffdd44'; ctx.fillText('COMBO', x + 32, y + 42); }
    else if (g.syn === 'soft') { ctx.fillStyle = '#aaa'; ctx.fillText('SOFT', x + 32, y + 42); }
    x += w + gap;
  }
}
function drawBar(x, y, w, h, ratio, color, label, val, mirror) {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#244'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  const fw = Math.max(0, Math.min(1, ratio)) * (w - 2);
  ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 8;
  if (mirror) ctx.fillRect(x + (w - 1 - fw), y + 1, fw, h - 2);
  else ctx.fillRect(x + 1, y + 1, fw, h - 2);
  ctx.shadowBlur = 0;
  ctx.font = 'bold 11px monospace'; ctx.fillStyle = '#aaa'; ctx.textAlign = mirror ? 'right' : 'left';
  ctx.fillText(label, mirror ? x + w : x, y - 4);
  ctx.fillStyle = '#fff'; ctx.fillText(Math.round(val), mirror ? x : x + w, y - 4);
  ctx.restore();
}
function drawScoreFeedback(sf) {
  const a = Math.min(1, sf.life / 30);
  const def = sf.glyphId ? G[sf.glyphId] : null;
  const tc = tierColor(sf.tier);
  const baseY = 110, baseX = sf.caster === 'p1' ? 140 : 820;
  ctx.save(); ctx.globalAlpha = a;
  ctx.font = 'bold 22px monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = tc; ctx.shadowColor = tc; ctx.shadowBlur = 14;
  ctx.fillText(Math.round(sf.score * 100) + '%', baseX, baseY);
  ctx.font = 'bold 13px monospace'; ctx.fillStyle = '#fff';
  ctx.fillText(sf.tier.toUpperCase() + (sf.fired ? '' : ' · ' + (sf.reason || '')), baseX, baseY + 18);
  if (def) { ctx.fillStyle = def.color; ctx.fillText(def.ja, baseX, baseY + 36); }
  if (sf.comboHint) { ctx.fillStyle = '#ffdd44'; ctx.font = 'bold 10px monospace'; ctx.fillText(sf.comboHint, baseX, baseY + 50); }
  ctx.shadowBlur = 0; ctx.restore();
}
function drawGlyphIcon(shape, s) {
  ctx.beginPath();
  switch (shape) {
    case 'zigzag':      ctx.moveTo(-s, -s/2); ctx.lineTo(-s/3, s/3); ctx.lineTo(s/3, -s/3); ctx.lineTo(s, s/2); ctx.stroke(); break;
    case 'circle':      ctx.arc(0, 0, s * 0.85, 0, Math.PI * 2); ctx.stroke(); break;
    case 'triangle':    ctx.moveTo(0, -s); ctx.lineTo(s, s * 0.7); ctx.lineTo(-s, s * 0.7); ctx.closePath(); ctx.stroke(); break;
    case 'invTriangle': ctx.moveTo(0, s); ctx.lineTo(s, -s * 0.7); ctx.lineTo(-s, -s * 0.7); ctx.closePath(); ctx.stroke(); break;
    case 'check':       ctx.moveTo(-s, 0); ctx.lineTo(-s/4, s/2); ctx.lineTo(s, -s); ctx.stroke(); break;
    case 'rect':        ctx.rect(-s, -s * 0.7, 2 * s, 1.4 * s); ctx.stroke(); break;
    case 'v':           ctx.moveTo(-s, -s/2); ctx.lineTo(0, s); ctx.lineTo(s, -s/2); ctx.stroke(); break;
    case 'crescent':    ctx.arc(0, 0, s, Math.PI * 0.2, Math.PI * 0.8); ctx.stroke(); break;
    case 'twoLines':    ctx.moveTo(-s, -s/3); ctx.lineTo(s, -s/3); ctx.moveTo(s, s/3); ctx.lineTo(-s, s/3); ctx.stroke(); break;
    case 'spiral':      for (let i = 0; i <= 25; i++) { const a = i * 0.4, r = (i / 25) * s; if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.stroke(); break;
    case 'spiralOut':   for (let i = 0; i <= 25; i++) { const a = i * 0.5, r = 2 + (i / 25) * s; if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.stroke(); break;
    case 'grid':        ctx.moveTo(-s, -s); ctx.lineTo(s, -s); ctx.lineTo(s, 0); ctx.lineTo(-s, 0); ctx.lineTo(-s, s); ctx.lineTo(s, s); ctx.stroke(); break;
    case 'longWave':    ctx.moveTo(-s, 0); for (let i = 1; i <= 6; i++) ctx.lineTo(-s + (i / 6) * 2 * s, ((i % 2) - 0.5) * s); ctx.stroke(); break;
    case 'x':           ctx.moveTo(-s, -s); ctx.lineTo(s, s); ctx.moveTo(s, -s); ctx.lineTo(-s, s); ctx.stroke(); break;
    case 'doubleTri':   ctx.moveTo(-s, s); ctx.lineTo(-s/2, -s); ctx.lineTo(0, s); ctx.lineTo(s/2, -s); ctx.lineTo(s, s); ctx.stroke(); break;
    case 'wave':        ctx.moveTo(-s, 0); for (let i = 1; i <= 4; i++) ctx.lineTo(-s + (i / 4) * 2 * s, Math.sin(i * Math.PI / 2) * s * 0.6); ctx.stroke(); break;
    case 'figure8':     for (let i = 0; i <= 30; i++) { const t = (i / 30) * Math.PI * 2; const x = Math.cos(t) * s; const y = Math.sin(t * 2) * s * 0.5; if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); } ctx.stroke(); break;
    case 'star':        for (let i = 0; i <= 10; i++) { const a = (i / 10) * Math.PI * 2 - Math.PI / 2, r = i % 2 === 0 ? s : s * 0.4; if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.stroke(); break;
    case 'arrow':       ctx.moveTo(s, 0); ctx.lineTo(-s, 0); ctx.moveTo(-s, 0); ctx.lineTo(-s/2, -s/2); ctx.moveTo(-s, 0); ctx.lineTo(-s/2, s/2); ctx.stroke(); break;
    case 'upTriangle':  ctx.moveTo(0, -s); ctx.lineTo(s, s/2); ctx.lineTo(-s, s/2); ctx.closePath(); ctx.stroke(); break;
    case 'dot':         ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill(); break;
    case 'shortWave':   ctx.moveTo(-s, 0); ctx.quadraticCurveTo(-s/2, -s, 0, 0); ctx.quadraticCurveTo(s/2, s, s, 0); ctx.stroke(); break;
    case 'clock':       ctx.arc(0, 0, s * 0.7, 0, Math.PI * 2); ctx.moveTo(0, 0); ctx.lineTo(s * 0.5, 0); ctx.stroke(); break;
    case 'narrowZ':     ctx.moveTo(-s/2, -s); ctx.lineTo(s/2, -s); ctx.lineTo(-s/2, s); ctx.lineTo(s/2, s); ctx.stroke(); break;
    case 'xMark':       ctx.moveTo(-s/2, -s/2); ctx.lineTo(s/2, s/2); ctx.moveTo(-s/2, s/2); ctx.lineTo(s/2, -s/2); ctx.stroke(); break;
    case 'shortLine':   ctx.moveTo(-s/2, 0); ctx.lineTo(s/2, 0); ctx.stroke(); break;
    case 'pentagon':    for (let i = 0; i <= 5; i++) { const a = (i / 5) * Math.PI * 2 - Math.PI / 2; if (i === 0) ctx.moveTo(Math.cos(a) * s, Math.sin(a) * s); else ctx.lineTo(Math.cos(a) * s, Math.sin(a) * s); } ctx.stroke(); break;
    case 'whirl':       for (let i = 0; i <= 25; i++) { const a = i * 0.6, r = s - (i / 25) * s; if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.stroke(); break;
    case 'omega':       ctx.moveTo(-s, s); ctx.lineTo(-s/2, -s/2); ctx.lineTo(s/2, -s/2); ctx.lineTo(s, s); ctx.stroke(); break;
    case 'teardrop':    ctx.moveTo(0, -s); ctx.bezierCurveTo(s, 0, s/2, s, 0, s); ctx.bezierCurveTo(-s/2, s, -s, 0, 0, -s); ctx.stroke(); break;
    default:            ctx.arc(0, 0, s * 0.5, 0, Math.PI * 2); ctx.stroke();
  }
}

// ─── RESULT ───
function drawResult() {
  // Reuse battle scene rendering as backdrop, dimmed
  ctx.save(); ctx.globalAlpha = 0.4;
  drawMage(state.p1, '#7df9ff', false);
  drawMage(state.ai, '#ff44dd', true);
  ctx.restore();
  ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, 960, 640);
  const won = state.winner === 'p1';
  const draw = state.winner === 'draw';
  ctx.font = 'bold 64px monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = draw ? '#aaa' : (won ? '#7df9ff' : '#ff44dd');
  ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 30;
  ctx.fillText(draw ? 'DRAW' : (won ? 'VICTORY' : 'DEFEAT'), 480, 130);
  ctx.shadowBlur = 0;
  ctx.font = 'bold 18px monospace'; ctx.fillStyle = '#fff';
  ctx.fillText(`${Math.round(state.p1.hp)} HP   vs   ${Math.round(state.ai.hp)} HP`, 480, 170);
  // Stats panel
  const ms = state.matchStats;
  const sx = 200, sy = 220, sw = 560, sh = 240;
  ctx.fillStyle = 'rgba(20,20,30,0.85)'; ctx.fillRect(sx, sy, sw, sh);
  ctx.strokeStyle = '#7df9ff'; ctx.lineWidth = 1; ctx.strokeRect(sx + 0.5, sy + 0.5, sw - 1, sh - 1);
  ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#7df9ff';
  ctx.fillText('MATCH STATS', sx + sw / 2, sy + 22);
  const rows = [
    ['CASTS',          ms.casts],
    ['HITS',           ms.hits],
    ['DAMAGE DEALT',   Math.round(ms.dmgDealt)],
    ['DAMAGE TAKEN',   Math.round(ms.dmgTaken)],
    ['MAX SCORE',      Math.round(ms.maxScore * 100) + '%'],
    ['COMBOS',         ms.combosTriggered],
    ['DIFFICULTY',     save.difficulty.toUpperCase()],
  ];
  ctx.font = '13px monospace'; ctx.textAlign = 'left';
  let ry = sy + 50;
  for (const [k, v] of rows) {
    ctx.fillStyle = '#888'; ctx.fillText(k, sx + 30, ry);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'right'; ctx.fillText(v, sx + sw - 30, ry);
    ctx.textAlign = 'left';
    ry += 24;
  }
  // Lifetime
  const ls = save.lifetime;
  ctx.font = '11px monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#888';
  ctx.fillText(`LIFETIME · ${ls.wins}W · ${ls.losses}L · ${ls.draws}D · BEST ${Math.round(ls.bestScore * 100)}%`, 480, 490);
  // Buttons
  drawButton(280, 520, 180, 50, 'REMATCH', inRect({ x: pointerX, y: pointerY }, 280, 520, 180, 50), '#88ff88');
  drawButton(500, 520, 180, 50, 'MENU', inRect({ x: pointerX, y: pointerY }, 500, 520, 180, 50), '#7df9ff');
}

// ═══════════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════════
let lastT = performance.now();
function loop(t) {
  let dt = (t - lastT) / 1000; if (dt > 0.1) dt = 0.1;
  lastT = t;
  update(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
